    <!--
      Admin entry detection. Runs before the app bundle is parsed, so the
      router choice is made before React (and the public homepage) exists.
      Accepts #/admin…, #admin…, #!/admin… and normalises them to #/admin…
      Also honours a same-origin parent frame's hash (preview wrappers).
    -->
    <script>
      (function () {
        var RX = /^#!?\/?admin(?:[\/?]|$)/i;
        var h = location.hash;
        try {
          if (!RX.test(h) && window.top !== window && RX.test(window.top.location.hash)) {
            h = window.top.location.hash;
          }
        } catch (e) { /* cross-origin parent: ignore */ }
        var admin = RX.test(h);
        if (admin) {
          var target = "#" + h.replace(/^#!?\/?/, "/");
          if (location.hash !== target) {
            history.replaceState(history.state, "", location.pathname + location.search + target);
          }
        }
        window.__HHS_ENTRY__ = admin ? "admin" : "public";
      })();
    </script>

    <script>
      /*
        Social crawlers require ABSOLUTE og:image / og:url values; the tags above
        ship relative because the production domain is unknown at build time.

        → When you have the real URL, set SITE_URL (e.g. "https://hariharasudhan.dev")
          and this emits a canonical link plus absolute OG/Twitter URLs.
        → Left empty, it only resolves the image paths against the current origin
          and emits no canonical, so nothing points at a domain you do not own.
      */
      (function () {
        var SITE_URL = ""; // ← set your production URL here
        try {
          var base = SITE_URL.replace(/\/+$/, "") || location.origin;
          var abs = function (v) {
            return /^https?:/i.test(v) ? v : base + "/" + String(v).replace(/^\/+/, "");
          };
          ["og:image", "twitter:image"].forEach(function (k) {
            var el =
              document.querySelector('meta[property="' + k + '"]') ||
              document.querySelector('meta[name="' + k + '"]');
            if (el) el.setAttribute("content", abs(el.getAttribute("content")));
          });
          var touch = document.querySelector('link[rel="apple-touch-icon"]');
          if (touch) touch.setAttribute("href", abs(touch.getAttribute("href")));

          if (SITE_URL) {
            var page = base + location.pathname + location.search;
            var can = document.createElement("link");
            can.rel = "canonical";
            can.href = page;
            document.head.appendChild(can);
            var ogUrl = document.createElement("meta");
            ogUrl.setAttribute("property", "og:url");
            ogUrl.content = page;
            document.head.appendChild(ogUrl);
          }
        } catch (e) {
          /* metadata is best-effort — never block rendering */
        }
      })();
    </script>
